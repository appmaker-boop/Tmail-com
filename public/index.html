<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tmail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <div class="logo-container">
                <span class="logo-t">T</span><span>mail</span>
            </div>
            <h1>Welcome to Tmail</h1>
            <p>Create an account to start messaging</p>
            <form id="signup-form" onsubmit="handleSignup(event)">
                <div class="input-group">
                    <input type="text" id="username-input" placeholder="Choose a username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="password-input" placeholder="Choose a password" required>
                </div>
                <button type="submit" class="btn-primary">Done</button>
            </form>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <header>
            <div class="header-left">
                <div class="header-logo">
                    <span class="logo-t" style="font-size: 24px;">T</span><span>mail</span>
                </div>
            </div>
            <div class="header-right">
                <div id="user-avatar" class="profile-avatar" onclick="toggleMenu(event)">A</div>
                
                <div id="profile-menu" class="profile-menu hidden">
                    <div id="menu-avatar-large" class="menu-avatar">A</div>
                    <div id="menu-username-display" class="menu-username">Username</div>
                    <div id="menu-email-display" class="menu-email">username@tmail.com</div>
                    <button class="btn-logout" onclick="handleLogout()">Sign out & Delete Account</button>
                </div>
            </div>
        </header>

        <div class="main-layout">
            <div class="compose-btn" onclick="openCompose()">
                <span>✏️</span> <span>Compose</span>
            </div>
            <sidebar>
                <div class="nav-item active" id="nav-inbox" onclick="switchFolder('inbox')">
                    <span>📥 Inbox</span>
                    <span id="inbox-count">0</span>
                </div>
                <div class="nav-item" id="nav-sent" onclick="switchFolder('sent')">
                    <span>📤 Sent</span>
                    <span id="sent-count">0</span>
                </div>
                <div class="nav-item" id="nav-drafts" onclick="switchFolder('drafts')">
                    <span>📄 Drafts</span>
                    <span id="drafts-count">0</span>
                </div>
            </sidebar>

            <div class="content-area" id="main-content-area"></div>
        </div>
    </div>

    <div id="compose-modal" class="compose-modal hidden">
        <div class="compose-header">
            <span>New Message</span>
            <span onclick="closeCompose()">✕</span>
        </div>
        <div class="compose-body">
            <input type="text" id="compose-to" placeholder="To (e.g., friend@tmail.com)">
            <input type="text" id="compose-subject" placeholder="Subject">
            <textarea id="compose-body-text" placeholder="Write your message..."></textarea>
        </div>
        <div class="compose-footer">
            <span style="font-size: 13px; color: #5f6368; cursor: pointer;" onclick="saveDraft()">Save Draft</span>
            <button class="btn-send" onclick="sendEmail()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
